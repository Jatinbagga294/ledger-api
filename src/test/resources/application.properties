# Tests run on in-memory H2 in Postgres compatibility mode, so `mvn test` needs
# no database running anywhere.
spring.datasource.url=jdbc:h2:mem:ledger;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
