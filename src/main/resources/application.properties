spring.application.name=ledger-api

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ledger}
spring.datasource.username=${DB_USER:ledger}
spring.datasource.password=${DB_PASSWORD:ledger}

# validate, not update: the schema is owned by migrations, not by Hibernate
# guessing at it on boot. Flyway is the next step; see the README.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

server.error.include-message=always
