spring.application.name=ledger-api

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/ledger}
spring.datasource.username=${DB_USER:ledger}
spring.datasource.password=${DB_PASSWORD:ledger}

# update is for local development only. In production the schema should be owned
# by versioned migrations (Flyway is the next step; see the README), with this set to validate.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

server.error.include-message=always
